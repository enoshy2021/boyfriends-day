<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For You ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;

      font-family: Georgia, serif;
      background: #fff4f6;
      color: #4a2932;
    }

    .container {
      width: 90%;
      max-width: 600px;
      padding: 40px 20px;
    }

    .small {
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 48px;
      line-height: 1.1;
      margin: 25px 0;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    button {
      margin: 15px 5px;
      padding: 14px 28px;
      border: none;
      border-radius: 30px;
      background: #91455b;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="container">

    <p class="small">A little something for you...</p>

    <h1>
      Happy<br>
      Boyfriend's Day ❤️
    </h1>

    <p>
      I made this little corner of the internet
      just for you.
    </p>

    <button onclick="openLetter()">
      Open it 💌
    </button>

  </div>

  <script>

    function openLetter() {

      document.querySelector(".container").innerHTML = `

        <p class="small">Chapter One</p>

        <h1>
          Hey you... ❤️
        </h1>

        <p>
          I haven't known you for 25 years,
          but I hope I get to know you
          for the rest of my life.
        </p>

        <button onclick="nextPage()">
          Continue →
        </button>

      `;
    }


    function nextPage() {

      document.querySelector(".container").innerHTML = `

        <p class="small">A little question...</p>

        <h1>
          How well do you know me? 👀
        </h1>

        <p>
          Let's find out...
        </p>

        <button onclick="quiz()">
          Take the quiz 🎮
        </button>

      `;
    }


    function quiz() {

      document.querySelector(".container").innerHTML = `

        <p class="small">Question 1</p>

        <h1>
          What's my favourite thing about you?
        </h1>

        <button onclick="wrong()">
          Your hair 😌
        </button>

        <button onclick="correct()">
          The way you make me feel ❤️
        </button>

        <button onclick="wrong()">
          Your jokes 😂
        </button>

      `;
    }


    function correct() {

      document.querySelector(".container").innerHTML = `

        <h1>
          You got it! 🥹❤️
        </h1>

        <p>
          Okay... maybe you do know me
          pretty well.
        </p>

        <button onclick="finalMessage()">
          One last thing →
        </button>

      `;
    }


    function wrong() {

      alert("Hmmmm... try again 😌❤️");

    }


    function finalMessage() {

      document.querySelector(".container").innerHTML = `

        <p class="small">
          For you ❤️
        </p>

        <h1>
          I haven't known you for 25 years...
        </h1>

        <p>
          But I hope I get to know you
          for the rest of my life.
          <br><br>
          Happy Boyfriend's Day,
          my love. ❤️
        </p>

        <div style="font-size:40px;">
          💗 🥹 💗
        </div>

      `;

    }

  </script>

</body>
</html>
